  watchlist.ItemView:
    properties:
      changePct:
        type: string
      createdAt:
        type: string
      gainPctSinceAdded:
        type: string
      market:
        example: CN
        type: string
      note:
        type: string
      price:
        description: |-
          行情缺失时以下字段为 null，前端显示「暂无行情」，而不是 0。

          类型是 *string 而不是 *float64：指针保留「有没有这个数」的语义，
          字符串保留精度。两者都不能省——用 float64 则 12.34 到前端可能变成
          12.339999999999999，用非指针则「停牌没有行情」和「价格为 0」再也分不开。
        type: string
      referenceDate:
        type: string
      referencePrice:
        type: string
      sortOrder:
