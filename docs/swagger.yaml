  scheduling.CreateJobRequest:
    properties:
      cron:
        description: |-
          Cron 是 5 段标准表达式（也接受 @daily 这类描述符），不是 6 段带秒的写法——
          例子里多一段秒，是这个接口最常见的 400。
        example: 30 9 * * *
        type: string
      kind:
        enum:
          - market_sync
          - scheduled_analysis
          - data_cleanup
        type: string
      maxConsecutiveFailures:
        type: integer
      name:
        type: string
      payload:
        additionalProperties: { }
        description: Payload 原样透传给运行器，接口层不解释它的结构——那是运行器的语义。
        type: object
      timeoutSeconds:
        type: integer
    required:
      - cron
      - kind
      - name
    type: object
  scheduling.CronPreviewView:
    properties:
      cron:
        example: 30 9 * * *
        type: string
      next:
        items:
          type: string
        type: array
    type: object
  scheduling.DeleteJobView:
    properties:
      deleted:
        example: true
        type: boolean
    type: object
  scheduling.ExecutionView:
    properties:
      attempt:
        type: integer
      delayMs:
        type: integer
      durationMs:
        description: "DurationMs / DelayMs / QueueWaitMs 都读固化值或由固化值直接得出，\n不在读路径上用
          time.Since 重算——执行记录是历史，耗时不该随每次刷新而变长。\n\n三段时长各自回答一个不同的问题，合成一个数字就再也分不开：\n\tDelayMs
          \     调度器多久之后才发现这次触发（上限是巡检间隔）\n\tQueueWaitMs  消息在队列里排了多久（变大说明消费者不够用）\n\tDurationMs
          \  真正执行花了多久"
        type: integer
      error:
        type: string
      finishedAt:
        type: string
      id:
        type: string
      itemCount:
        type: integer
      jobId:
        type: string
      kind:
        type: string
      manual:
        type: boolean
      queueWaitMs:
        type: integer
      queuedAt:
        type: string
      scheduledAt:
        type: string
      startedAt:
        type: string
      status:
        type: string
      statusText:
        type: string
      summary:
        type: string
    type: object
  scheduling.JobView:
    properties:
      consecutiveFailures:
        type: integer
      createdAt:
        type: string
      createdBy:
        type: integer
      cron:
        example: 30 9 * * *
        type: string
      cronValid:
        type: boolean
      id:
        type: string
      kind:
        type: string
      kindText:
        type: string
      lastRunAt:
        type: string
      lastStatus:
        type: string
      lastStatusText:
        type: string
      maxConsecutiveFailures:
        type: integer
      name:
        type: string
      nextRunAt:
        type: string
      payload:
        additionalProperties: { }
        type: object
      status:
        type: string
      statusText:
        type: string
      successRate:
        description: |-
          SuccessRate 直接照搬聚合里固化好的派生量。
          这里刻意不写 float64(success)/float64(total)*100：成功率是写入当时算好并落库的
          事实，接口层重算会让列表接口和详情接口在并发写入时给出互相矛盾的数字。
        type: string
      successRuns:
        type: integer
      timeoutSeconds:
        type: integer
      totalRuns:
        type: integer
      updatedAt:
        type: string
    type: object
  scheduling.PauseJobView:
    properties:
