        example: true
        type: boolean
    type: object
  scheduling.PreviewCronRequest:
    properties:
      count:
        description: Count 是推演条数，不传或非正数按 5 条；上限 50 由值对象收敛。
        example: 5
        type: integer
      cron:
        description: Cron 与创建接口同一套规则：5 段标准表达式，或 @daily 这类描述符。
        example: 30 9 * * *
        type: string
    required:
      - cron
    type: object
  scheduling.ResumeJobView:
    properties:
      resumed:
        example: true
        type: boolean
    type: object
  scheduling.UpdateJobRequest:
    properties:
      cron:
        example: 30 9 * * *
        type: string
      maxConsecutiveFailures:
        type: integer
      name:
        type: string
      payload:
        additionalProperties: { }
        type: object
      timeoutSeconds:
        type: integer
    type: object
  screening.ColumnView:
