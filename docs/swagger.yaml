  screening.CriterionRequest:
    properties:
      field:
        example: pe
        type: string
      operator:
        enum:
          - gt
          - gte
          - lt
          - lte
          - eq
          - ne
          - between
          - in
          - not_in
        example: lt
        type: string
      values:
        description: |-
          Values 一律以字符串传，个数由比较符的元数决定：between 恰好 2 个，
          in/not_in 至少 1 个，其余恰好 1 个。
        example:
          - "20"
        items:
          type: string
        type: array
    required:
      - field
      - operator
      - values
    type: object
  screening.CriterionView:
    properties:
      field:
        example: pe
        type: string
      label:
        example: 市盈率
        type: string
      operator:
        enum:
          - gt
          - gte
          - lt
          - lte
          - eq
          - ne
          - between
          - in
          - not_in
        example: lt
        type: string
      sortOrder:
        type: integer
      values:
        example:
          - "20"
        items:
          type: string
        type: array
    type: object
  screening.DeleteResultView:
    properties:
      deleted:
        example: true
        type: boolean
    type: object
  screening.FieldDictView:
    properties:
      fields:
        items:
          $ref: '#/definitions/screening.FieldView'
        type: array
    type: object
  screening.FieldView:
    properties:
      kind:
        description: |-
          Kind 决定该字段能接受哪些比较符：numeric 有全序，九个比较符全可用；
          categorical 无序，只剩相等与集合运算。Operators 已按此过滤，
          前端不必自己再推一遍。
        enum:
          - numeric
          - categorical
        example: numeric
        type: string
      label:
        example: 净资产收益率
        type: string
      name:
        description: Name 就是提交 criterionRequest.field 时要填的串。
        example: roe
        type: string
      operators:
        items:
          $ref: '#/definitions/screening.OperatorView'
        type: array
      unit:
        description: Unit 是量纲提示（% / 万元），供输入框渲染后缀；无量纲字段不下发该键。
        example: '%'
        type: string
    type: object
  screening.OperatorView:
    properties:
      label:
        example: 介于
        type: string
      maxValues:
        example: 2
        type: integer
      minValues:
        description: |-
          ValueCount 告诉前端这个比较符要渲染几个输入框：
          1 个（大于）、2 个（介于）、或者一个可增删的多值控件（属于，min=1 max=0）。
        example: 2
        type: integer
      value:
        enum:
          - gt
          - gte
          - lt
          - lte
          - eq
          - ne
          - between
          - in
          - not_in
        example: between
        type: string
    type: object
  screening.ResultRowView:
    properties:
      market:
        example: CN
        type: string
      name:
        example: 贵州茅台
        type: string
      symbol:
        example: 600519.SH
        type: string
      values:
        additionalProperties: { }
        description: |-
          Values 的键是字段名，值为字符串（数值字段）、字符串（类别字段）或 null（缺失）。
          数值以字符串输出，理由同其它上下文：JSON 数字在前端就是 float64。
        type: object
    type: object
  screening.ResultSetView:
    properties:
      asOf:
        description: |-
          AsOf 必须回给前端：筛选是对某一天横截面的查询，盘后与次日早盘
          执行同一个模板结果不同是正常的，但用户看不到日期就只会觉得系统不稳定。
        example: "2024-05-31"
        type: string
      columns:
        items:
          $ref: '#/definitions/screening.ColumnView'
        type: array
      items:
        items:
          $ref: '#/definitions/screening.ResultRowView'
        type: array
      total:
        description: Total 是命中总数，可能大于 len(items)——超出条数上限的部分被截断。
        example: 128
        type: integer
      truncated:
        description: Truncated 为真表示 total 超过了本次的条数上限，页面应提示用户收紧条件。
        type: boolean
    type: object
  screening.RunRequest:
    properties:
      criteria:
        items:
          $ref: '#/definitions/screening.CriterionRequest'
        type: array
      limit:
        description: Limit 留空按 50 条，上限 500；超出部分由值对象直接收敛，不报错。
        example: 50
        type: integer
      sortDirection:
        enum:
          - asc
          - desc
        example: desc
        type: string
      sortField:
        example: total_mv
        type: string
    required:
      - criteria
    type: object
  screening.TemplateRequest:
    properties:
      criteria:
        description: |-
          Criteria 整份替换，没有「增量加一条」的形状：编辑表单一次提交整份列表，
          增量语义会让「用户删掉了一条」无法表达。最多 20 条。
        items:
          $ref: '#/definitions/screening.CriterionRequest'
        type: array
      description:
        type: string
      isPublic:
        description: IsPublic 置真即上架「选股策略广场」：任何登录用户都能查看并执行，但改不动。
        type: boolean
      limit:
        example: 50
        type: integer
      name:
        example: 低估值蓝筹
        type: string
      sortDirection:
        enum:
          - asc
          - desc
        example: desc
        type: string
      sortField:
        example: total_mv
        type: string
    type: object
  screening.TemplateView:
    properties:
      createdAt:
        type: string
      criteria:
        items:
          $ref: '#/definitions/screening.CriterionView'
        type: array
      description:
        type: string
      id:
        type: integer
      isPublic:
        type: boolean
      limit:
        example: 50
        type: integer
      name:
        type: string
      sortDirection:
        enum:
          - asc
          - desc
        example: desc
        type: string
      sortField:
        description: |-
          SortField / SortDirection 恒为已展开的有效值：模板未指定排序时，
          这里回的是兜底的 total_mv desc，而不是空串。
        example: total_mv
        type: string
      updatedAt:
        type: string
    type: object
  stock.FinancialView:
    properties:
      debtRatio:
        type: string
      eps:
        type: string
      grossMargin:
        type: string
      netMargin:
        type: string
      netProfit:
        type: string
      pb:
        type: string
      pe:
        type: string
      periodType:
        example: annual
        type: string
      reportDate:
        example: "2023-12-31"
        type: string
      revenue:
        type: string
      roe:
        description: |-
          四个比率都是百分数口径，且都取自落库值；netMargin 尤其不要在前端
          用 netProfit/revenue 复算——两者来自不同的数据源字段，口径未必一致。
        type: string
      source:
        type: string
      symbol:
        example: "600519"
        type: string
      updatedAt:
        type: string
    type: object
  stock.KlineView:
    properties:
      adjusted:
        type: boolean
      amount:
        type: string
      close:
        type: string
      high:
        type: string
      low:
        type: string
      open:
        type: string
      period:
        example: daily
        type: string
      source:
        type: string
      symbol:
        example: "600519"
        type: string
      tradeDate:
        example: "2024-05-31"
        type: string
      volume:
        type: string
    type: object
  stock.NewsView:
    properties:
      content:
        type: string
      negative:
        type: boolean
      positive:
        type: boolean
      publishedAt:
        type: string
      sentiment:
        description: |-
          情感分是 [-1, 1] 区间的数值，同样以字符串输出；
          positive/negative 是服务端按 ±0.2 中性带给出的判定，前端不要自己定阈值。
        example: "0.62"
        type: string
      source:
        type: string
      symbol:
        example: "600519"
        type: string
      title:
        type: string
      url:
        type: string
    type: object
  stock.QuoteView:
    properties:
      amount:
        type: string
      change:
        description: Change / ChangePct 直接透传落库值，不在这里用 Close-PreClose 重算。
        type: string
      changePct:
        type: string
      close:
        type: string
      high:
        type: string
      limitUp:
        type: boolean
      low:
        type: string
      market:
        example: CN
        type: string
      open:
        type: string
      pb:
        type: string
      pe:
        type: string
      preClose:
        type: string
      source:
        type: string
      symbol:
        example: "600519"
        type: string
      tradeDate:
        example: "2024-05-31"
        type: string
      turnover:
        type: string
      updatedAt:
        type: string
      volume:
        type: string
    type: object
  stock.StockView:
    properties:
      analyzable:
        type: boolean
      area:
        type: string
      circulatingMarketValue:
        type: string
      delisted:
        type: boolean
      fullCode:
        example: 600519.SH
        type: string
      id:
        type: integer
      industry:
        type: string
      listDate:
        example: "2001-08-27"
        type: string
      market:
        example: CN
        type: string
      name:
        type: string
      source:
        type: string
      symbol:
        example: "600519"
        type: string
      totalMarketValue:
        description: |-
          市值原样输出数据源给的值，前端要换单位自己换——服务端换一次单位，
          跨源对账时就再也说不清页面上的数字是哪个口径了。

          数值一律以字符串输出：JavaScript 的 number 就是 float64，
          服务端再怎么用 decimal 精确计算，一旦以 JSON 数字送出去，
          前端 JSON.parse 的那一刻精度就没了。
        type: string
      updatedAt:
        type: string
    type: object
  stock.SyncRunView:
    properties:
      cursor:
        description: |-
          cursor 是断点续传的游标，记录最后一个处理完的标的代码；
          resumable 为 true 时可以从这里接着跑。
        type: string
      durationMs:
        type: integer
      error:
        type: string
      failed:
        type: integer
      finishedAt:
        type: string
      id:
        type: string
      kind:
        example: quotes
        type: string
      kindName:
        example: 行情快照
        type: string
      market:
        example: CN
        type: string
      resumable:
        type: boolean
      skipped:
        type: integer
      startedAt:
        type: string
      status:
        example: succeeded
        type: string
      succeeded:
        description: |-
          successRate 与 quote 里的比率一样是字符串：成功率是 decimal 算出来的，
          走 JSON 数字就会在前端退化成 float64。
        type: integer
      successRate:
        type: string
      total:
        type: integer
      triggeredBy:
        example: user:1
        type: string
    type: object
  stock.TriggerSyncRequest:
    properties:
