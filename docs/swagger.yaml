  report.ReportView:
    properties:
      action:
        enum:
          - buy
          - hold
          - sell
          - reduce
          - increase
          - undecided
        type: string
      actionText:
        type: string
      confidence:
        description: |-
          下面这组直接读聚合里固化的数字。这里刻意不写 Confidence*100 之类的换算，
          也不按 TargetPrice/StopLoss 现算盈亏比：派生量是生成当时算好并落库的事实，
          接口层重算会让同一份报告每刷新一次都可能给出不同的数字。
        type: string
      createdAt:
        type: string
      id:
        example: rpt_20260917_a1b2c3d4e5f6
        type: string
      market:
        example: CN
        type: string
      position:
        type: string
      riskScore:
        type: string
      sections:
        items:
          $ref: '#/definitions/report.SectionView'
        type: array
      stopLoss:
        type: string
      summary:
        type: string
      symbol:
        example: 600519.SH
        type: string
      targetPrice:
        type: string
      taskId:
        example: task_20260917_a1b2c3d4e5f6
        type: string
      title:
        type: string
      tradeDate:
        example: "2026-09-17"
        type: string
      userId:
        type: integer
    type: object
