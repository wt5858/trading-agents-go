        type: boolean
      kind:
        enum:
          - openai_compat
          - anthropic
          - google
        example: openai_compat
        type: string
      models:
        example:
          - deepseek-chat
          - deepseek-reasoner
        items:
          type: string
        type: array
      name:
        example: deepseek
        type: string
      priority:
        example: 100
        type: integer
    required:
      - kind
      - name
    type: object
  system.DeletedView:
    properties:
      deleted:
        example: true
        type: boolean
    type: object
  system.ReloadRequest:
