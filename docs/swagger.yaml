      - ""
    type: string
    x-enum-comments:
      MarketCN: A 股
      MarketHK: 港股
      MarketUS: 美股
    x-enum-descriptions:
      - A 股
      - 港股
      - 美股
      - ""
    x-enum-varnames:
      - MarketCN
      - MarketHK
      - MarketUS
      - MarketUnknown
  value_objects.PhaseOutcome:
