    type: object
  system.UpdateProviderRequest:
    properties:
      baseUrl:
        example: https://api.deepseek.com
        type: string
      models:
        example:
          - deepseek-chat
          - deepseek-reasoner
        items:
          type: string
        type: array
      priority:
        example: 100
        type: integer
    type: object
  system.UpsertSettingRequest:
    properties:
      description:
        example: 默认分析模型
        type: string
      key:
        example: llm.default_model
        type: string
      value:
        example: deepseek-chat
        type: string
    required:
