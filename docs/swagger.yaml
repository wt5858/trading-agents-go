    type: object
  value_objects.Action:
    enum:
      - buy
      - hold
      - sell
      - reduce
      - increase
      - undecided
    type: string
    x-enum-varnames:
      - ActionBuy
      - ActionHold
      - ActionSell
      - ActionReduce
      - ActionIncrease
      - ActionUndecided
  value_objects.Decision:
    properties:
      action:
        $ref: '#/definitions/value_objects.Action'
      confidence:
        description: 0-1
        type: number
      position:
        description: 建议仓位百分比 0-100
        type: number
      reasoning:
        type: string
      risk_score:
        description: 0-10，越高越危险
        type: number
      stop_loss:
        type: number
      summary:
        type: string
      target_price:
        type: number
    type: object
  value_objects.Market:
    enum:
