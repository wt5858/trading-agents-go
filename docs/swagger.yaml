    type: object
  watchlist.AddStockRequest:
    properties:
      code:
        example: 600519.SH
        type: string
      market:
        description: Market 留空时由代码自动推断，只有代码本身不带后缀时才需要显式给出。
        example: CN
        type: string
      note:
        example: 业绩拐点，盯一下
        type: string
    required:
      - code
    type: object
  watchlist.DeletedView:
    properties:
      deleted:
        example: true
        type: boolean
    type: object
  watchlist.GroupDetailView:
    properties:
      group:
        $ref: '#/definitions/watchlist.GroupView'
      items:
        items:
          $ref: '#/definitions/watchlist.ItemView'
        type: array
    type: object
  watchlist.GroupNameRequest:
    properties:
      name:
        example: 科技股
        type: string
    required:
