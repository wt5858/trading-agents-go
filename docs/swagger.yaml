          description: 未登录或令牌无效
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: 源或目标分组不存在、不属于当前用户，或该标的不在源分组内
          schema:
            $ref: '#/definitions/response.Envelope'
        "409":
          description: 目标分组中已存在该标的
          schema:
            $ref: '#/definitions/response.Envelope'
        "429":
          description: 目标分组已达 200 只上限
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
        - BearerAuth: [ ]
      summary: 跨分组移动自选股
      tags:
        - 自选股
securityDefinitions:
  BearerAuth:
    description: 填入 "Bearer {accessToken}"，令牌由 POST /auth/login 获取。
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
tags:
  - description: 登录、刷新令牌、查询当前身份。除标的行情外的接口都要先拿到这里的令牌。
    name: 认证
  - description: 用户管理。列表与创建、停用需要管理员权限，改自己的资料与口令不需要。
    name: 用户
  - description: 标的主数据、行情、K 线、财务与新闻。唯一一组免登录的接口。
    name: 股票行情
  - description: 自选分组与分组内标的的增删改排序。
    name: 自选股
  - description: 条件选股与选股模板。先取 /screening/fields 拿字段字典，再据此构造条件。
    name: 选股
  - description: 智能体阵容与技术指标快照。
    name: 智能体
  - description: 提交与追踪多智能体分析。任务异步执行，进度经 SSE 推送。
    name: 分析任务
  - description: 分析任务产出的结构化报告。
    name: 分析报告
  - description: 模拟账户、下单与持仓。全部为模拟撮合，不涉及任何真实资金或真实委托。
    name: 模拟交易
  - description: 站内通知的查询与已读状态。
    name: 通知
  - description: 定时任务的增删改与手动触发。cron 为五段式（分 时 日 月 周）。
    name: 定时任务
  - description: 行情与主数据的同步作业触发与历史。
    name: 数据同步
  - description: 模型供应商与系统设置。全部需要管理员权限；返回的 API Key 一律是掩码。
    name: 系统配置
