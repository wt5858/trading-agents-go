    type: object
  watchlist.ReorderedView:
    properties:
      reordered:
        example: true
        type: boolean
    type: object
  watchlist.UpdateNoteRequest:
    properties:
      note:
        example: 业绩拐点，盯一下
        type: string
    type: object
  watchlist.UpdatedView:
    properties:
      updated:
        example: true
        type: boolean
    type: object
info:
  contact: { }
  description: |-
    多智能体股票分析平台 HTTP 接口。

    所有响应共用同一个信封 {"code":0,"message":"ok","data":{...}}，
    code 为 0 表示成功，非 0 时 data 恒为 null，具体取值见 response 包。

    健康检查 GET /healthz 不在 /api/v1 之下，因此未收录于本文档。

    免责声明：本平台仅用于学习与研究，不构成投资建议。分析结论由大模型生成，
    可能包含事实性错误。过往表现不代表未来收益，投资有风险，可能损失本金。
  title: Trading Agents API
  version: "1.0"
paths:
  /agents/crew:
    get:
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
              - $ref: '#/definitions/response.Envelope'
              - properties:
                  data:
                    $ref: '#/definitions/agent.CrewView'
                type: object
      summary: 智能体阵容
      tags:
        - 智能体
  /agents/indicators/{code}:
    get:
      parameters:
        - description: 标的代码
          example: "600519"
          in: path
          name: code
          required: true
          type: string
        - description: 市场：CN/HK/US，留空按代码推断
          in: query
          name: market
          type: string
        - description: K 线周期：daily/weekly/monthly，默认 daily
          in: query
          name: period
          type: string
        - description: 交易日 YYYY-MM-DD，默认取当天；当天无行情则退到最近一个已算过的交易日
          in: query
          name: date
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
              - $ref: '#/definitions/response.Envelope'
              - properties:
                  data:
                    $ref: '#/definitions/agent.IndicatorView'
                type: object
        "400":
          description: 代码、周期或交易日不合法
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: 该标的尚无已落库的指标快照
          schema:
            $ref: '#/definitions/response.Envelope'
        "503":
          description: 技术指标仓储未就绪
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: 技术指标快照
      tags:
        - 智能体
  /analysis/batches:
    post:
      consumes:
        - application/json
      parameters:
        - description: 批量分析请求，单批次股票数量有上限
          in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/analysis.SubmitBatchRequest'
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
              - $ref: '#/definitions/response.Envelope'
              - properties:
                  data:
                    $ref: '#/definitions/analysis.SubmitBatchView'
                type: object
        "400":
          description: 请求参数不合法或超出单批次上限
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: 未登录或令牌无效
          schema:
            $ref: '#/definitions/response.Envelope'
        "429":
          description: 并发分析数已达上限
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: 批次落库或入队失败
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
        - BearerAuth: [ ]
      summary: 批量提交分析任务
      tags:
        - 分析任务
  /analysis/batches/{id}:
    get:
      parameters:
        - description: 批次 ID
          in: path
          name: id
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
              - $ref: '#/definitions/response.Envelope'
              - properties:
                  data:
                    $ref: '#/definitions/analysis.BatchView'
                type: object
        "401":
          description: 未登录或令牌无效
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: 批次不存在
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
        - BearerAuth: [ ]
      summary: 查询分析批次
      tags:
        - 分析任务
  /analysis/tasks:
    get:
      parameters:
        - description: 目标用户 ID，仅管理员可传，缺省为自己
          in: query
          name: userId
          type: integer
        - description: 任务状态过滤，留空表示不限
          enum:
            - queued
            - running
            - completed
            - failed
            - canceled
          in: query
          name: status
          type: string
        - description: 页码，默认 1
          in: query
          name: page
          type: integer
        - description: 每页条数，默认 20
          in: query
          name: pageSize
          type: integer
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
              - $ref: '#/definitions/response.Envelope'
              - properties:
                  data:
                    allOf:
                      - $ref: '#/definitions/response.PageData'
                      - properties:
                          items:
